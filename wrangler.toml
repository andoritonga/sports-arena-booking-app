name = "sportkuy-demo"
main = "src/index.ts"
compatibility_date = "2025-02-01"

# Static Assets (100% Free on Cloudflare Workers)
[assets]
directory = "./public"
binding = "ASSETS"

# Cloudflare D1 Database (100% Free Tier, no credit card required)
[[d1_databases]]
binding = "DB"
database_name = "sportkuy-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
SESSION_SECRET = "change-this-to-a-secure-random-secret-key"
