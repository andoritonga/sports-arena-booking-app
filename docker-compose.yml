version: '3.8'

services:
  db:
    image: mariadb:10.11
    container_name: sportkuy-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: asdfghjkl
      MYSQL_DATABASE: project_sport_center
    volumes:
      - db_data:/var/lib/mysql
      - ./project_sport_center.sql:/docker-entrypoint-initdb.d/project_sport_center.sql
    ports:
      - "3307:3306"
    networks:
      - sportkuy-net

  app:
    build: .
    container_name: sportkuy-app
    restart: always
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: asdfghjkl
      DB_NAME: project_sport_center
    volumes:
      - ./:/var/www/html
    depends_on:
      - db
    networks:
      - sportkuy-net

networks:
  sportkuy-net:
    driver: bridge

volumes:
  db_data:
